<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Català C1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Disseny: quadern d'estudi mediterrani — columna única, blau de mar i ocre com a subratllador */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf3; --ink:#152030; --muted:#5a6676; --line:#d9e0e8;
  --accent:#1c5aa6; --accent-ink:#ffffff; --soft:#e3ecf8; --ochre:#d9971a; --ochre-soft:#fbefd6;
  --ok:#2b7a4b; --ok-soft:#e1f2e7; --bad:#b83a2e; --bad-soft:#f9e3e0;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171f29; --sunk:#121922; --ink:#e7ecf2; --muted:#9aa6b4; --line:#273242;
  --accent:#6aa2ea; --accent-ink:#0b1422; --soft:#1a2a40; --ochre:#efb544; --ochre-soft:#33280f;
  --ok:#5cc08a; --ok-soft:#14301f; --bad:#f0806f; --bad-soft:#3a1a16; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171f29; --sunk:#121922; --ink:#e7ecf2; --muted:#9aa6b4; --line:#273242;
  --accent:#6aa2ea; --accent-ink:#0b1422; --soft:#1a2a40; --ochre:#efb544; --ochre-soft:#33280f;
  --ok:#5cc08a; --ok-soft:#14301f; --bad:#f0806f; --bad-soft:#3a1a16; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin:0}
.brand h1 span{color:var(--accent)}
.sync{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs button{font:inherit;font-size:.95rem;background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{padding-top:22px;display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.08rem;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,input:focus-visible,.cell:focus-visible,.chip:focus-visible,.key:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Avui */
.today{display:grid;gap:14px}
.today .when{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.blocks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.blocks li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:8px}
.blocks .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.blocks .min{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.weekstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ws{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:.8rem;background:var(--surface);cursor:pointer;color:var(--ink);font-family:inherit}
.ws b{display:block;font-family:var(--f-mono);font-size:.95rem}
.ws.done{background:var(--ok-soft);border-color:transparent}
.ws.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:8px;background:var(--sunk)}
.stat b{font-family:var(--f-display);font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
/* Calendari */
.cal{display:grid;gap:6px}
.wk{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.wk header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wk .num{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.wk .cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{font:inherit;font-size:.78rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 4px;text-align:center;cursor:pointer;min-height:44px}
.cell small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.68rem}
.cell.done{background:var(--ok-soft);border-color:transparent}
.cell.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.exam{border-style:dashed;border-color:var(--ochre)}
.wk.consol .num{color:var(--ochre)}
/* Sessió */
.sess-top{display:grid;gap:8px}
.qcard{display:grid;gap:14px}
.qtext{font-size:1.2rem;line-height:1.45}
.qtext b{background:linear-gradient(transparent 62%,var(--ochre-soft) 62%);font-weight:700}
.qtext .word,.qtext .clock{font-family:var(--f-mono);font-size:1.3rem;background:none}
.qtext .verb{font-family:var(--f-display);font-weight:800;font-size:1.8rem;letter-spacing:-.01em}
.gap{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.qsub{color:var(--muted)}
.qsub b{color:var(--ink)}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;font:inherit;font-size:1.15rem;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.answer input.ok{border-color:var(--ok)} .answer input.ko{border-color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-family:var(--f-mono);font-size:1rem;min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);cursor:pointer}
.opts{display:grid;gap:8px}
.opt{font:inherit;font-size:1.05rem;text-align:left;padding:12px 14px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.ko{background:var(--bad-soft)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--ok)} .fb.ko .verdict{color:var(--bad)}
.ptable{border-collapse:collapse;margin-top:6px;font-size:.92rem}
.ptable td{padding:2px 12px 2px 0}
.ptable tr.hl td{font-weight:700;color:var(--accent)}
.ptable td:first-child{color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.result{display:grid;gap:12px;text-align:left}
.bigscore{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.errlist{margin:0;padding-left:18px;display:grid;gap:4px}
/* Practica / teoria */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.theory{display:grid;gap:14px}
.theory h4{font-family:var(--f-display);font-size:1rem;margin:8px 0 0}
.theory p,.theory li{max-width:65ch}
.theory ul{margin:0;padding-left:20px;display:grid;gap:4px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.92rem;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modbar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:.92rem}
.modbar span:last-child{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:8px;background:var(--bad-soft)}
input[type=date]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:480px){nav.tabs button{padding:8px 8px 10px;font-size:.9rem}.stat b{font-size:1.2rem}.stat{padding:10px}.stat .muted{font-size:.8rem}.modbar{grid-template-columns:90px 1fr 54px}.qtext .verb{font-size:1.5rem}.blocks li{grid-template-columns:1fr auto}.blocks .n{display:none}}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s ease}}
</style>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Català <span>C1</span></h1><span class="sync" id="sync">Desat en aquest navegador</span></div>
    <nav class="tabs" id="tabs">
      <button data-v="avui">Avui</button><button data-v="cal">Calendari</button><button data-v="prac">Practica</button><button data-v="teo">Teoria</button><button data-v="prog">Progrés</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<script>
// ===== VERBS =====
const PERS = ['jo','tu','ell / ella','nosaltres','vosaltres','ells / elles'];
const E6 = (s,e)=>e.map(x=>s+x);
const G = {
  ava: s=>E6(s,['ava','aves','ava','àvem','àveu','aven']),
  ia:  s=>E6(s,['ia','ies','ia','íem','íeu','ien']),
  eia: s=>E6(s,['eia','eies','eia','èiem','èieu','eien']),
  uia: s=>E6(s,['uia','uies','uia','úiem','úieu','uien']),
  gui: s=>E6(s,['i','is','i','em','eu','in']),
  se:  s=>E6(s,['és','essis','és','éssim','éssiu','essin']),
  si:  s=>E6(s,['ís','issis','ís','íssim','íssiu','issin']),
};
// v(inf, glossa, nivell, present, imperfet, arrel futur, subj. present, subj. imperfet, participi, imperatiu [tu, vosaltres])
const VDEF = [
 ['parlar','hablar',1,'parlo parles parla parlem parleu parlen',G.ava('parl'),'parlar',G.gui('parl'),G.se('parl'),'parlat',['parla','parleu']],
 ['menjar','comer',1,'menjo menges menja mengem mengeu mengen',G.ava('menj'),'menjar',['mengi','mengis','mengi','mengem','mengeu','mengin'],G.se('meng'),'menjat',['menja','mengeu']],
 ['perdre','perder',1,'perdo perds perd perdem perdeu perden',G.ia('perd'),'perdr',G.gui('perd'),G.se('perd'),'perdut',['perd','perdeu']],
 ['dormir','dormir',1,'dormo dorms dorm dormim dormiu dormen',G.ia('dorm'),'dormir',['dormi','dormis','dormi','dormim','dormiu','dormin'],G.si('dorm'),'dormit',['dorm','dormiu']],
 ['llegir','leer',1,'llegeixo llegeixes llegeix llegim llegiu llegeixen',G.ia('lleg'),'llegir',['llegeixi','llegeixis','llegeixi','llegim','llegiu','llegeixin'],G.si('lleg'),'llegit',['llegeix','llegiu']],
 ['servir','servir',1,'serveixo serveixes serveix servim serviu serveixen',G.ia('serv'),'servir',['serveixi','serveixis','serveixi','servim','serviu','serveixin'],G.si('serv'),'servit',['serveix','serviu']],
 ['obrir','abrir',1,'obro obres obre obrim obriu obren',G.ia('obr'),'obrir',['obri','obris','obri','obrim','obriu','obrin'],G.si('obr'),'obert',['obre','obriu']],
 ['ser','ser',1,'soc ets és som sou són',['era','eres','era','érem','éreu','eren'],'ser',G.gui('sigu'),['fos','fossis','fos','fóssim','fóssiu','fossin'],'estat|sigut',['sigues','sigueu']],
 ['estar','estar',1,'estic estàs està estem esteu estan',G.ava('est'),'estar',G.gui('estigu'),G.se('estigu'),'estat',['estigues','estigueu']],
 ['haver','haber',1,'he has ha hem heu han',G.ia('hav'),'haur',['hagi','hagis','hagi','hàgim','hàgiu','hagin'],G.se('hagu'),'hagut',null],
 ['fer','hacer',1,'faig fas fa fem feu fan',G.eia('f'),'far',['faci','facis','faci','fem','feu','facin'],['fes','fessis','fes','féssim','féssiu','fessin'],'fet',['fes','feu']],
 ['anar','ir',1,'vaig vas va anem aneu van',G.ava('an'),'anir',['vagi','vagis','vagi','anem','aneu','vagin'],G.se('an'),'anat',['vés','aneu']],
 ['dir','decir',1,'dic dius diu diem dieu diuen',G.eia('d'),'dir',G.gui('digu'),G.se('digu'),'dit',['digues','digueu']],
 ['veure','ver',1,'veig veus veu veiem veieu veuen',G.eia('v'),'veur',G.gui('veg'),G.se('vei'),'vist',['veges','vegeu']],
 ['venir','venir',1,'vinc vens ve venim veniu venen',G.ia('ven'),'vindr',G.gui('vingu'),G.se('vingu'),'vingut',['vine','veniu']],
 ['tenir','tener',1,'tinc tens té tenim teniu tenen',G.ia('ten'),'tindr',G.gui('tingu'),G.se('tingu'),'tingut',['tingues|té','tingueu|teniu']],
 ['poder','poder',1,'puc pots pot podem podeu poden',G.ia('pod'),'podr',G.gui('pugu'),G.se('pogu'),'pogut',null],
 ['voler','querer',1,'vull vols vol volem voleu volen',G.ia('vol'),'voldr',G.gui('vulgu'),G.se('volgu'),'volgut',['vulgues','vulgueu']],
 ['saber','saber',1,'sé saps sap sabem sabeu saben',G.ia('sab'),'sabr',['sàpiga','sàpigues','sàpiga','sapiguem','sapigueu','sàpiguen'],G.se('sab'),'sabut',['sàpigues','sapigueu']],
 ['viure','vivir',2,'visc vius viu vivim viviu viuen',G.ia('viv'),'viur',G.gui('visqu'),G.se('visqu'),'viscut',['viu','viviu']],
 ['escriure','escribir',2,'escric escrius escriu escrivim escriviu escriuen',G.ia('escriv'),'escriur',G.gui('escrigu'),G.si('escriv'),'escrit',['escriu','escriviu']],
 ['conèixer','conocer',2,'conec coneixes coneix coneixem coneixeu coneixen',G.ia('coneix'),'coneixer',G.gui('conegu'),G.se('conegu'),'conegut',['coneix','coneixeu']],
 ['beure','beber',2,'bec beus beu bevem beveu beuen',G.ia('bev'),'beur',G.gui('begu'),G.se('begu'),'begut',['beu','beveu']],
 ['caure','caer',2,'caic caus cau caiem caieu cauen',G.eia('qu'),'caur',G.gui('caigu'),G.se('caigu'),'caigut',['cau','caieu']],
 ['creure','creer',2,'crec creus creu creiem creieu creuen',G.eia('cr'),'creur',G.gui('cregu'),G.se('cregu'),'cregut',['creu','creieu']],
 ['dur','llevar',2,'duc duus|dus duu|du duem dueu duen',G.uia('d'),'dur',G.gui('dugu'),G.se('dugu'),'dut',['duu|du','dueu']],
 ['prendre','tomar',2,'prenc prens pren prenem preneu prenen',G.ia('pren'),'prendr',G.gui('prengu'),G.se('prengu'),'pres',['pren','preneu']],
 ['entendre','entender',2,'entenc entens entén entenem enteneu entenen',G.ia('enten'),'entendr',G.gui('entengu'),G.se('entengu'),'entès',['entén','enteneu']],
 ['treure','sacar',2,'trec treus treu traiem traieu treuen',G.eia('tr'),'treur',['tregui','treguis','tregui','traguem','tragueu','treguin'],G.se('tragu'),'tret',['treu','traieu']],
 ['moure','mover',2,'moc mous mou movem moveu mouen',G.ia('mov'),'mour',G.gui('mogu'),G.se('mogu'),'mogut',['mou','moveu']],
 ['córrer','correr',2,'corro corres corre correm correu corren',G.ia('corr'),'correr',G.gui('corr'),G.se('corregu'),'corregut',['corre','correu']],
 ['sortir','salir',2,'surto surts surt sortim sortiu surten',G.ia('sort'),'sortir',['surti','surtis','surti','sortim','sortiu','surtin'],G.si('sort'),'sortit',['surt','sortiu']],
 ['seure','sentarse',2,'sec seus seu seiem seieu seuen',G.eia('s'),'seur',G.gui('segu'),G.se('segu'),'segut',['seu','seieu']],
 ['riure','reír',2,'ric rius riu riem rieu riuen',G.eia('r'),'riur',G.gui('rigu'),G.se('rigu'),'rigut',['riu','rieu']],
 ['néixer','nacer',2,'neixo neixes neix naixem naixeu neixen',G.ia('naix'),'naixer',['neixi','neixis','neixi','naixem','naixeu','neixin'],G.se('nasqu'),'nascut',null],
 ['morir','morir',2,'moro mors mor morim moriu moren',G.ia('mor'),'morir',['mori','moris','mori','morim','moriu','morin'],G.si('mor'),'mort',null],
 ['valer','valer',2,'valc vals val valem valeu valen',G.ia('val'),'valdr',G.gui('valgu'),G.se('valgu'),'valgut',null],
];
const AUX_PERIF = ['vaig','vas|vares','va','vam|vàrem','vau|vàreu','van|varen'];
const AUX_HE = ['he','has','ha','hem','heu','han'];
const AUX_HAVIA = ['havia','havies','havia','havíem','havíeu','havien'];
const VERBS = {};
for (const d of VDEF){
  const [inf,gl,lvl,pres,impf,fs,subjp,subji,part,imp] = d;
  const t = {
    pres: pres.split(' '), impf, subjp, subji,
    fut: E6(fs,['é','às','à','em','eu','an']),
    cond: E6(fs,['ia','ies','ia','íem','íeu','ien']),
  };
  if (inf==='ser') t.cond = t.cond.map(x=>x); // fóra també s'accepta
  const parts = part.split('|');
  t.perif = AUX_PERIF.map(a=>a.split('|').map(x=>x+' '+inf).join('|'));
  t.perfet = AUX_HE.map(a=>parts.map(p=>a+' '+p).join('|'));
  t.plusq = AUX_HAVIA.map(a=>parts.map(p=>a+' '+p).join('|'));
  if (imp) t.imper = [imp[0], subjp[2], subjp[3], imp[1], subjp[5]];
  VERBS[inf] = {inf, gl, lvl, t, part};
}
const TENSES = {
  pres:{n:'Present d\'indicatiu', lvl:1, tip:'Present: jo -o (parlo), però molts irregulars acaben en -c (dic, vinc, puc, tinc).'},
  perif:{n:'Passat perifràstic', lvl:1, tip:'Perifràstic: vaig, vas, va, vam, vau, van + infinitiu (vaig anar). També vares, vàrem, vàreu, varen.'},
  perfet:{n:'Perfet (pretèrit perfet)', lvl:1, tip:'Perfet: he, has, ha, hem, heu, han + participi. S\'usa per a accions dins d\'un temps no acabat (avui, aquest any).'},
  fut:{n:'Futur', lvl:1, tip:'Futur: arrel + -é, -às, -à, -em, -eu, -an. Irregulars: faré, aniré, tindré, vindré, podré, voldré, sabré, hauré.'},
  impf:{n:'Imperfet d\'indicatiu', lvl:2, tip:'Imperfet: -ar → -ava (parlava, parlàvem); -er/-ir → -ia (tenia, teníem). Irregulars: era, feia, deia, veia, queia, duia.'},
  cond:{n:'Condicional', lvl:2, tip:'Condicional: arrel del futur + -ia, -ies, -ia, -íem, -íeu, -ien (faria, aniria, tindria).'},

prep:`<h3>Preposicions</h3>
<h4>a / en / amb</h4>
<ul><li><b>a</b>: destinació i situació amb topònims i noms amb article (vaig a Girona, soc a casa, a les cinc).</li>
<li><b>en</b>: davant de demostratius, indefinits i numerals (també <i>a</i>): en aquell edifici. <b>En + infinitiu</b> = quan: <i>en sortir</i> (no <i>al sortir</i>).</li>
<li><b>amb</b>: companyia i instrument (amb un amic, amb ganivet). Mitjà de transport: <i>amb tren</i> o <i>en tren</i>.</li></ul>
<h4>per / per a</h4>
<ul><li><b>per</b>: causa, mitjà, lloc de pas, agent (per por, per correu, per Lleida).</li>
<li><b>per a</b>: destinatari, finalitat davant de nom i termini (per a tu, per al mal de cap, per a dilluns).</li>
<li>Davant d'infinitiu (finalitat): <i>per</i> o <i>per a</i>.</li></ul>
<h4>Caiguda i canvi</h4>
<ul><li>Les preposicions àtones (<i>a, en, de, amb</i>) <b>cauen davant de <i>que</i></b>: estic segur que..., m'alegro que...</li>
<li>Davant d'infinitiu es mantenen, però <b>en</b> i <b>amb</b> canvien a <b>a</b>: insistir en → insisteix a pagar; interessat a aprendre.</li></ul>
<h4>Contraccions</h4>
<p>al, als (a + el/els) · del, dels · pel, pels · cal (ca + el). No hi ha contracció davant de vocal: <i>a l'hospital, de l'home</i>.</p>
<h4>Règim verbal freqüent</h4>
<p>començar a · acabar de · deixar de · tornar a · aprendre a · oblidar-se de · tractar de · convidar a · casar-se amb · somiar amb · fixar-se en · pensar en · dependre de · adonar-se de · confiar en.</p>`,
acc:`<h3>Accentuació</h3>
<ul><li><b>Agudes</b> (síl·laba tònica final): porten accent si acaben en vocal, -as, -es, -is, -os, -us, -en, -in (cafè, francès, també, entén). No: interessos, ordinador.</li>
<li><b>Planes</b>: porten accent si NO acaben en aquestes terminacions (telèfon, fàcil, mòbil, préssec). No: examen, jove.</li>
<li><b>Esdrúixoles</b>: sempre porten accent (música, química, època).</li></ul>
<h4>Obert o tancat</h4>
<p><b>à</b> sempre greu. <b>í, ú</b> sempre agut. La <b>e</b> i la <b>o</b> poden ser obertes (è, ò: cafè, mòbil) o tancades (é, ó: també, cançó).</p>
<h4>Els 15 diacrítics (normativa 2017)</h4>
<p>bé · déu · és · mà · més · món · pèl · què · sé · sí · sòl · són · té · ús · vós (i els derivats com <i>desfés, reté, entretén</i>).</p>
<h4>Dièresi</h4>
<ul><li>Sobre la u de <b>gü, qü</b> + e/i quan la u sona: pingüí, qüestió, aigües.</li>
<li>Sobre i/u per trencar diftong: veïna, raïm, països, traduït, agraïm.</li>
<li>No en porten: els infinitius, futurs i condicionals (agrair, agrairé), ni els sufixos -isme, -ista (egoisme), ni molts prefixos (reunió).</li></ul>`,
ort:`<h3>Ortografia</h3>
<ul><li><b>b / v</b>: haver, govern, cavall, advocat, provar (tastar, intentar) / probable, treball.</li>
<li><b>s / ss</b>: s sonora entre vocals (casa, rosa); s sorda entre vocals → ss (passar, pissarra).</li>
<li><b>c / ç / tz / z</b>: ç davant de a, o, u (plaça, començo) i c davant de e, i (comencem). Dotze, tretze, setze; verbs en -itzar.</li>
<li><b>g / j / tg / tj</b>: g davant de e, i (mengem, gener); j davant de a, o, u (menjar, jove). tg davant de e, i (metge, viatge) i tj davant de a, o, u (platja, viatjar).</li>
<li><b>l·l</b>: intel·ligent, col·legi, il·lusió, pel·lícula. <b>ll</b>: bellesa, callar.</li>
<li><b>h</b>: hivern, home, habitació; sense h: ou, orfe, ombra, arpa.</li></ul>
<h4>Apostrofació</h4>
<ul><li><b>el, de</b> s'apostrofen davant de vocal o h: l'home, d'hivern (excepte i, u semivocals: el iogurt).</li>
<li><b>la</b> s'apostrofa davant de vocal tònica (l'hora, l'aigua), però no davant de i, u àtones (la universitat, la història), ni de <i>a-</i> negativa (la anormalitat), ni de <i>una</i> (la una).</li></ul>
<h4>Guionet</h4>
<p>Numerals (vint-i-dos, dos-cents), punts cardinals (nord-americà), abans-d'ahir, compostos verb + nom amb s/r/x (para-sol). Els prefixos van junts: exministre, contraatac.</p>`,
bas:`<h3>Hores amb quarts</h3>
<div class="tbl"><table><tr><th>Rellotge</th><th>Es diu</th></tr>
<tr><td>5:00</td><td>Són les cinc</td></tr>
<tr><td>5:15</td><td>És un quart de sis</td></tr>
<tr><td>5:20</td><td>És un quart i cinc de sis</td></tr>
<tr><td>5:25</td><td>Són dos quarts menys cinc de sis</td></tr>
<tr><td>5:30</td><td>Són dos quarts de sis</td></tr>
<tr><td>5:45</td><td>Són tres quarts de sis</td></tr>
<tr><td>5:55</td><td>Són les sis menys cinc</td></tr>
<tr><td>12:30</td><td>Són dos quarts d'una</td></tr>
<tr><td>10:15</td><td>És un quart d'onze</td></tr></table></div>
<p>Les hores són femenines: <i>les dues, dos quarts de dues</i>. Franges: matinada, matí, migdia, tarda, vespre, nit.</p>
<h4>Números</h4>
<p>Guionet entre desenes i unitats (trenta-dos), <i>vint-i-</i> (vint-i-tres), i entre unitats i centenes (dos-cents). <i>Mil</i> sense guionet (dos mil). Femení: una, dues, dues-centes. Ordinals: primer, segon, tercer, quart, cinquè, sisè, setè, vuitè, novè, desè.</p>
<h4>Dates</h4>
<p>El tres de març · l'onze de setembre · d'abril, d'agost, d'octubre. Dies: dilluns, dimarts, dimecres, dijous, divendres, dissabte, diumenge. Estacions: primavera, estiu, tardor, hivern.</p>
<h4>Colors</h4>
<p>groc/groga/grocs/grogues · blau/blava/blaus/blaves · gris/grisa/grisos/grises · marró/marrons. Invariables: rosa, taronja, lila, i els compostos (verd fosc, blau cel).</p>
<h4>Expressions de temps</h4>
<p>abans-d'ahir · ahir · avui · demà · demà passat · enguany · l'any passat · d'aquí a una setmana · fa dos dies · quinzena · trimestre · dècada · segle.</p>`

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

const accType = w=>{
  const v='aàeèéiíïoòóuúü'; const low=w.toLowerCase();
  let idx=-1; for(let i=0;i<low.length;i++) if('àèéíòóú'.includes(low[i])) idx=i;
  if(idx<0) return 'No porta accent gràfic.';
  // compta grups vocàlics després de la vocal accentuada
  let groups=0,inV=false; for(let i=idx+1;i<low.length;i++){const isV=v.includes(low[i]); if(isV&&!inV)groups++; inV=isV;}
  if(groups===0) return 'Aguda: porta accent si acaba en vocal, -as, -es, -is, -os, -us, -en, -in.';
  if(groups===1) return 'Plana: porta accent si NO acaba en vocal, -as, -es, -is, -os, -us, -en, -in.';
  return 'Esdrúixola: sempre porta accent.';
};
ACC_WORDS.forEach((w,i)=>{

const HN=['','una','dues','tres','quatre','cinc','sis','set','vuit','nou','deu','onze','dotze'];
const deH=n=>(n===1||n===11)?`d'${HN[n]}`:`de ${HN[n]}`;
const theH=n=>n===1?'la una':`les ${HN[n]}`;
function horaItem(H,M){
  const h12=((H+11)%12)+1, nx=(h12%12)+1;
  const map={15:'un quart',30:'dos quarts',45:'tres quarts',20:'un quart i cinc',35:'dos quarts i cinc',50:'tres quarts i cinc',10:'un quart menys cinc',25:'dos quarts menys cinc',40:'tres quarts menys cinc'};
  let main, alt=[];
  if(M===0) main=theH(h12);
  else if(M===5) main=theH(h12)+' i cinc';
  else if(M===55) { main=theH(nx)+' menys cinc'; alt.push('tres quarts i deu '+deH(nx)); }
  else main=`${map[M]} ${deH(nx)}`;
  if(M===15) alt.push(theH(h12)+' i quart'); if(M===30) alt.push(theH(h12)+' i mitja'); if(M===45) alt.push(theH(nx)+' menys quart');
  const verb = (main.startsWith('la una')||main.startsWith('un quart'))?'és':'són';
  const all=[main,...alt].flatMap(a=>[a,'és '+a,'són '+a]);
  const dig=`${H}:${String(M).padStart(2,'0')}`;
  return {id:`h:${H}:${M}`,mod:'bas',topic:'hores',lvl:[0,15,30,45].includes(M)?1:2,kind:'input',
    q:`Quina hora és? <b class="clock">${dig}</b>`,sub:'Fes servir el sistema de quarts (sense "del matí", "de la tarda"...)',ans:all,
    exp:`<b>${verb[0].toUpperCase()+verb.slice(1)} ${main}.</b> Els quarts compten cap a l'hora següent: entre les ${HN[h12]} i les ${HN[nx]}, "${deH(nx)}". Les hores són femenines (les dues, d'una, d'onze).`};
}
function genHora(r,lvlMax){
  const Ms = lvlMax>=2?[0,15,30,45,15,30,45,20,35,50,10,25,40,5,55]:[0,15,30,45,15,30,45];
  return horaItem(Math.floor(r()*24)||12, pickOne(Ms,r));
}
const U=['zero','u','dos','tres','quatre','cinc','sis','set','vuit','nou','deu','onze','dotze','tretze','catorze','quinze','setze','disset','divuit','dinou'];
const T={2:'vint',3:'trenta',4:'quaranta',5:'cinquanta',6:'seixanta',7:'setanta',8:'vuitanta',9:'noranta'};
function u1(n,f){ if(n===1) return f?'una':'un'; if(n===2) return f?'dues':'dos'; return U[n]; }
function b100(n,f){ if(n<20) return u1(n,f); const t=Math.floor(n/10),u=n%10; if(!u) return T[t]; return T[t]+(t===2?'-i-':'-')+u1(u,f); }
function b1000(n,f){ const h=Math.floor(n/100),r=n%100; let s=''; if(h===1) s='cent'; else if(h>1) s=u1(h,f)+(f?'-centes':'-cents'); if(r) s+=(s?' ':'')+b100(r,f); return s; }
function num2cat(n,f){ const th=Math.floor(n/1000),r=n%1000; let s=''; if(th===1) s='mil'; else if(th>1) s=b1000(th,f)+' mil'; if(r) s+=(s?' ':'')+b1000(r,f); return s; }
const NOUNS=[['llibres',0],['cases',1],['persones',1],['euros',0],['pàgines',1],['anys',0],['quilòmetres',0],['cadires',1],['alumnes',0],['places',1]];
function numItem(n,ni){
  const [noun,f]=NOUNS[ni]; const w=num2cat(n,!!f);
  return {id:`n:${n}:${ni}`,mod:'bas',topic:'num',lvl:n<100?1:(n<1000?2:3),kind:'input',q:`Escriu el número en lletres: <b>${n.toLocaleString('ca-ES')} ${noun}</b>`,sub:'Només el número, sense el nom.',ans:[w],
    exp:`<b>${w} ${noun}</b>. Guionet entre desenes i unitats (trenta-dos) i entre unitats i centenes (dos-cents); <i>vint-i-</i> porta dos guionets. ${f?'Amb noms femenins: una, dues, dues-centes...':''}`};
}
function genNum(r,lvlMax){
  let n; const L=1+Math.floor(r()*lvlMax);
  if(L===1) n=21+Math.floor(r()*79); else if(L===2) n=101+Math.floor(r()*899); else n=1001+Math.floor(r()*1998);
  if(n%100===11) n++;
  return numItem(n, Math.floor(r()*NOUNS.length));
}
const MESOS=['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
function dataItem(d,m){
  const day = d===11?"l'onze":'el '+b100(d,false);
  const mes = (/^[aeiou]/.test(MESOS[m])?"d'":'de ')+MESOS[m];
  const ans=`${day} ${mes}`;
  return {id:`d:${d}:${m}`,mod:'bas',topic:'dates',lvl:(d===11||/^[ao]/.test(MESOS[m]))?2:1,kind:'input',q:`Escriu la data en lletres, amb article: <b class="clock">${d}/${m+1}</b>`,sub:'Exemple: 5/3 → el cinc de març',ans:[ans, ans.replace(/^el /,'').replace(/^l'/,'')],
    exp:`<b>${ans}</b>. <i>De</i> s'apostrofa davant d'abril, agost i octubre; l'article s'apostrofa davant d'<i>onze</i> (l'onze de setembre).`};
}
function genData(r){ let d=2+Math.floor(r()*29); if(d===21) d=11; if(d===31) d=30; let m=Math.floor(r()*12); if(m===1&&d>28) d=28; if(r()<0.35) m=pickOne([3,7,9],r); return dataItem(d,m); }
const COLS={blanc:['blanc','blanca','blancs','blanques'],negre:['negre','negra','negres','negres'],groc:['groc','groga','grocs','grogues'],vermell:['vermell','vermella','vermells','vermelles'],verd:['verd','verda','verds','verdes'],blau:['blau','blava','blaus','blaves'],gris:['gris','grisa','grisos','grises'],morat:['morat','morada','morats','morades'],daurat:['daurat','daurada','daurats','daurades'],marró:['marró',null,'marrons',null],rosa:['rosa','rosa','rosa','rosa'],taronja:['taronja','taronja','taronja','taronja']};
const CNOUNS=[['una camisa',1],['un cotxe',0],['unes sabates',3],['uns pantalons',2],['unes flors',3],['uns ulls',2],['una paret',1],['un jersei',0],['unes cortines',3],['uns mitjons',2],['una bufanda',1],['un paraigua',0]];
function colorItem(c,ni){
  const [nn,k]=CNOUNS[ni]; const form=COLS[c][k];
  const inv=(c==='rosa'||c==='taronja');
  const lvl = ['groc','blau','gris'].includes(c)&&k>0?2:(inv?3:1);
  return {id:`k:${c}:${ni}`,mod:'bas',topic:'colors',lvl,kind:'input',q:`Fes la concordança: <b>${nn} ___</b> <span class="muted">(${c})</span>`,ans:[form],
    exp:`<b>${nn} ${form}</b>. ${inv?'<i>Rosa</i> i <i>taronja</i> com a color són invariables.':'Formes: '+COLS[c].filter(Boolean).join(', ')+'.'}`};
}
function genColor(r){ let c,ni; do{ c=pickOne(Object.keys(COLS),r); ni=Math.floor(r()*CNOUNS.length);}while(!COLS[c][CNOUNS[ni][1]]); return colorItem(c,ni); }
function conjItem(inf,t,p){
  const v=VERBS[inf]; const forms=v.t[t]; const isImp=t==='imper';
  const pers=isImp?IMPER_PERS[p]:PERS[p];
  const tbl=(isImp?IMPER_PERS:PERS).map((pp,i)=>`<tr${i===p?' class="hl"':''}><td>${pp}</td><td>${forms[i].replace(/\|/g,' / ')}</td></tr>`).join('');
  return {id:`c:${inf}:${t}:${p}`,mod:'verb',topic:'conj',lvl:Math.max(TENSES[t].lvl, v.lvl===2&&TENSES[t].lvl<3?TENSES[t].lvl+0:TENSES[t].lvl),kind:'input',
    q:`<span class="verb">${inf}</span> <span class="muted">(${v.gl})</span>`,sub:`${TENSES[t].n} · <b>${pers}</b>`,ans:forms[p].split('|'),
    exp:`${TENSES[t].tip}<table class="ptable">${tbl}</table>`};
}
function genConj(r,tenses,stage){
  const infs=Object.keys(VERBS);
  for(let k=0;k<50;k++){
    const t=pickOne(tenses,r); const inf=pickOne(infs,r);
    if(stage===1 && VERBS[inf].lvl===2 && r()<0.4) continue;
    if(!VERBS[inf].t[t]) continue;
    const p = t==='imper' ? pickOne([0,0,1,3,3],r) : Math.floor(r()*6);
    return conjItem(inf,t,p);
  }
  return conjItem('fer','pres',0);
}
function itemById(id){
  if(STATIC[id]) return STATIC[id];
  const p=id.split(':');
  try{
    if(p[0]==='c') return conjItem(p[1],p[2],+p[3]);
    if(p[0]==='h') return horaItem(+p[1],+p[2]);
    if(p[0]==='n') return numItem(+p[1],+p[2]);
    if(p[0]==='d') return dataItem(+p[1],+p[2]);
    if(p[0]==='k') return colorItem(p[1],+p[2]);
  }catch(e){}
  return null;
}

// ---- selecció ----
function pickStatic(filter,n,r,lw,seen,exclude){
  let pool=Object.values(STATIC).filter(it=>filter(it)&&!(exclude&&exclude.has(it.id)));
  const out=[];
  while(out.length<n && pool.length){
    const ws=pool.map(it=>(lw[it.lvl-1]||0.05)/(1+(seen[it.id]||0)*1.5));
    let tot=ws.reduce((a,b)=>a+b,0), x=r()*tot, i=0;
    for(;i<pool.length-1;i++){ x-=ws[i]; if(x<=0) break; }
    out.push(pool[i]); pool.splice(i,1);
  }
  return out;
}
function genMany(fn,n){ const out=[],ids=new Set(); for(let k=0;k<n*6&&out.length<n;k++){const it=fn(); if(!ids.has(it.id)){ids.add(it.id);out.push(it);} } return out; }

const VFOCUS_N=['Present i passat perifràstic','Futur i condicional','Imperfet i perfet','Subjuntiu present i imperatiu','Subjuntiu imperfet i plusquamperfet','Indicatiu o subjuntiu?','Tots els temps'];

function weekInfo(w){ // w 1..16
  const stage=w<=8?1:2, cw=w<=8?w:w-8;
  if(cw===8) return {w,stage,cw,consol:true,title:w===16?'Setmana final: simulacre':'Consolidació i simulacre',verbN:'Repàs de tots els temps',pronN:'Repàs de tots els pronoms'};
  return {w,stage,cw,consol:false,verbF:VFOCUS[cw-1],pronF:PFOCUS[cw-1],verbN:VFOCUS_N[cw-1],pronN:PFOCUS[cw-1]?MODS.pron.topics[PFOCUS[cw-1]]:'Tots els pronoms',title:`${VFOCUS_N[cw-1]} · ${PFOCUS[cw-1]?MODS.pron.topics[PFOCUS[cw-1]]:'Tots els pronoms'}`};
}
function seenTenses(wi){ if(wi.stage===2||wi.consol) return ALLT; const s=new Set(); for(let i=0;i<wi.cw;i++) (VFOCUS[i]||ALLT).forEach(t=>s.add(t)); return [...s]; }
function seenPron(wi){ if(wi.stage===2||wi.consol) return null; return PFOCUS.slice(0,wi.cw).filter(Boolean); }

    rot:['Accents','Ortografia','Preposicions'][wi.w%3], repas:'Repàs dels teus errors', simul:'Mini simulacre', hores:'Bàsics · Hores', num:'Bàsics · Números', dates:'Bàsics · Dates', colors:'Bàsics · Colors', temps:'Bàsics · Expressions de temps',
    mixA:'Verbs i pronoms', mixB:'Accents, ortografia i preposicions', mixC:'Bàsics variats', exam:'Simulacre complet'}[code];

function sessionPlan(idx){

  if(wi.consol) return {w,d,wi,blocks: d===4?[['exam',30]]:[['mixA',10],['mixB',8],['mixC',5]]};

function buildBlock(code,n,wi,r,S){
  const lw = wi.stage===1?[0.45,0.35,0.2]:[0.2,0.4,0.4];
  const seen=S.seen, lvlMax=wi.stage===1&&wi.cw<3?2:3;
  const st=(f,k)=>pickStatic(f,k,r,lw,seen);
  const conj=(k,tenses)=>genMany(()=>genConj(r,tenses,wi.stage),k);
  const basGen={hores:()=>genHora(r,lvlMax),num:()=>genNum(r,lvlMax),dates:()=>genData(r),colors:()=>genColor(r)};
  const bas=(topic,k)=>{ if(topic==='temps') return st(it=>it.mod==='bas'&&it.topic==='temps',k);
    const nStatic=Math.min(2,k-3); return shuffle([...genMany(basGen[topic],k-nStatic), ...st(it=>it.mod==='bas'&&it.topic===topic,nStatic)],r); };
  const sp=seenPron(wi);
  switch(code){
    case 'verbconj':{ const f=wi.verbF||ALLT; return shuffle([...conj(7,f), ...conj(3,seenTenses(wi))],r); }
    case 'verbmix':{ const f=wi.verbF||ALLT; return shuffle([...conj(5,f), ...st(it=>it.topic==='frases',5)],r); }
    case 'pron': return shuffle([...st(it=>it.mod==='pron'&&(wi.pronF?it.topic===wi.pronF:true),7), ...st(it=>it.mod==='pron'&&(!sp||sp.includes(it.topic))&&it.topic!==wi.pronF,3)],r);
    case 'pronmix': return st(it=>it.mod==='pron'&&(!sp||sp.includes(it.topic)),n);
    case 'acc': return st(it=>it.mod==='acc',n);
    case 'ort': return st(it=>it.mod==='ort',n);
    case 'prep': return st(it=>it.mod==='prep',n);
    case 'rot': return st(it=>it.mod===['acc','ort','prep'][wi.w%3],n);
    case 'hores': case 'num': case 'dates': case 'colors': case 'temps': return bas(code,n);
    case 'repas':{ const errs=Object.keys(S.err||{}).sort((a,b)=>(S.err[b]-S.err[a])).map(itemById).filter(Boolean).slice(0,n);
      if(errs.length<n){ errs.push(...conj(Math.ceil((n-errs.length)/2),seenTenses(wi))); errs.push(...st(it=>it.mod==='pron'&&(!sp||sp.includes(it.topic)),n-errs.length)); }
      return shuffle(errs,r); }
    case 'simul': return shuffle([...conj(3,seenTenses(wi)), ...st(it=>it.topic==='frases',1), ...st(it=>it.mod==='pron'&&(!sp||sp.includes(it.topic)),3), ...st(it=>it.mod==='prep',1), ...st(it=>it.mod==='acc',1), ...st(it=>it.mod==='ort',1)],r);
    case 'mixA': return shuffle([...conj(4,ALLT), ...st(it=>it.topic==='frases',2), ...st(it=>it.mod==='pron',4)],r);
    case 'mixB': return st(it=>['acc','ort','prep'].includes(it.mod),n);
    case 'mixC': return shuffle([genHora(r,3),genNum(r,3),genData(r),genColor(r), ...st(it=>it.mod==='bas'&&it.topic==='temps',1)],r);
    case 'exam': return shuffle([...conj(8,ALLT), ...st(it=>it.topic==='frases',4), ...st(it=>it.mod==='pron',8), ...st(it=>it.mod==='prep',3), ...st(it=>it.mod==='acc',3), ...st(it=>it.mod==='ort',2), genHora(r,3), genNum(r,3)],r);
  }
  return [];
}
function practiceBlock(mod,topic,r,S){
  const lw=[0.34,0.33,0.33];
  if(mod==='verb'&&topic==='conj') return genMany(()=>genConj(r,ALLT,2),10);
  if(mod==='verb'&&topic&&TENSES[topic]) return genMany(()=>genConj(r,[topic],2),10);
  if(mod==='bas'&&topic&&topic!=='temps'){ const g={hores:()=>genHora(r,3),num:()=>genNum(r,3),dates:()=>genData(r),colors:()=>genColor(r)}[topic]; return shuffle([...genMany(g,8),...pickStatic(it=>it.mod==='bas'&&it.topic===topic,2,r,lw,S.seen)],r); }
  if(mod==='verb'&&!topic) return shuffle([...genMany(()=>genConj(r,ALLT,2),6),...pickStatic(it=>it.topic==='frases',4,r,lw,S.seen)],r);
  return pickStatic(it=>it.mod===mod&&(!topic||it.topic===topic),10,r,lw,S.seen);
}

// ---- correcció ----
function norm(s){ return (s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/l[.•∙·-]l/g,'l·l').replace(/'\s+/g,"'").replace(/[.!?¡¿,;:]+/g,' ').replace(/\s+/g,' ').trim(); }
function check(it,val){
  if(it.kind==='mc') return {ok: val===it.correct, close:false};
  const v=norm(val); const ok=it.ans.some(a=>norm(a)===v);
  const close=!ok && it.ans.some(a=>stripAcc(norm(a))===stripAcc(v));
  return {ok,close};
}
// ===== INTERFÍCIE =====
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='catalaC1.v1';
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);};
function freshState(){ return {v:1,start:iso(mondayOf(new Date())),days:{},err:{},seen:{},stats:{},upd:0}; }
let S=freshState();
try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.v===1) S=Object.assign(freshState(),d); } }catch(e){}

// ---- desada ----
let cloudRef=null, writing=false, again=false, tmr=null;
function setSync(t){ const el=$('#sync'); if(el) el.textContent=t; }
function save(){
  S.upd=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  if(cloudRef){ clearTimeout(tmr); tmr=setTimeout(pushCloud,1200); }
}
async function pushCloud(){
  if(!cloudRef) return; if(writing){ again=true; return; }
  writing=true; setSync('Desant…');
  try{ await cloudRef.set(JSON.parse(JSON.stringify(S))); setSync('Desat al teu compte'); }
  catch(e){ setSync('Desat en aquest navegador'); }
  writing=false; if(again){ again=false; pushCloud(); }
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db) return;
    const id=await user.id(); if(!id) return;
    cloudRef=db.doc('data/users/'+id+'/progress');
    const snap=await cloudRef.get();
    if(snap.exists){
      const d=snap.data();
      if((d.upd||0)>(S.upd||0)){ S=Object.assign(freshState(),JSON.parse(JSON.stringify(d))); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} if(!RUN) render(); }
      else if((S.upd||0)>(d.upd||0)) pushCloud();
    } else if(S.upd) pushCloud();
    setSync('Desat al teu compte');
  }catch(e){ cloudRef=null; }
}

// ---- calendari ----
const TOTAL=80;
function sessionDate(idx){ const d=parseISO(S.start); d.setDate(d.getDate()+Math.floor(idx/5)*7+idx%5); return d; }
function todayIdx(){ const t=new Date(); const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate()); const diff=Math.round((t0-parseISO(S.start))/864e5); if(diff<0) return {before:true}; const w=Math.floor(diff/7),dw=diff%7; if(w>=16) return {after:true}; if(dw>4) return {weekend:true,w}; return {idx:w*5+dw}; }
function nextPending(){ for(let i=0;i<TOTAL;i++) if(!S.days[i]) return i; return null; }
const fmtD=(d,o)=>d.toLocaleDateString('ca-ES',o||{weekday:'long',day:'numeric',month:'long'});
const pct=(a,b)=>b?Math.round(a*100/b):0;
const MIN={A:8,B:7,C:5};
const DAB=['Dl','Dt','Dc','Dj','Dv'];

// ---- vistes ----
let VIEW='avui', RUN=null, THEO='verb';
function setView(v){ VIEW=v; RUN=null; render(); window.scrollTo(0,0); }
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.v); });
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===VIEW&&!RUN)));
  const m=$('#main');
  if(RUN){ m.innerHTML=RUN.done?renderResult():renderQ(); bindRun(); return; }
  m.innerHTML=({avui:vAvui,cal:vCal,prac:vPrac,teo:vTeo,prog:vProg})[VIEW]();
  bindView();
}
function sessionCard(idx,label){
  const pl=sessionPlan(idx), d=sessionDate(idx), st=S.days[idx];
  const items=pl.blocks.map(([c,n],i)=>`<li><span class="n">${i+1}</span><span>${esc(blockLabel(c,pl.wi))} <span class="muted">· ${n} exercicis</span></span><span class="min">${pl.blocks.length===1?'25':MIN['ABC'[i]]} min</span></li>`).join('');
  return `<section class="card today">
    <div class="when"><span class="eyebrow">${label} · Setmana ${pl.w} de 16 · ${esc(fmtD(d))}</span>${st?`<span class="eyebrow" style="color:var(--ok)">Feta · ${st.ok}/${st.n}</span>`:''}</div>
    <h2>${esc(pl.wi.title)}</h2>
    <ol class="blocks">${items}</ol>
    <div class="row"><button class="btn primary" data-start="${idx}">${st?'Torna-la a fer':'Comença la sessió'}</button>${S.err&&Object.keys(S.err).length?`<button class="btn" data-review="1">Repassa errors (${Object.keys(S.err).length})</button>`:''}</div>
  </section>`;
}
function weekStrip(w){
  const t=todayIdx();
  return `<div class="weekstrip">${[0,1,2,3,4].map(d=>{const i=(w-1)*5+d, st=S.days[i]; return `<button class="ws ${st?'done':''} ${t.idx===i?'now':''}" data-start="${i}" aria-label="Sessió ${DAYN[d]}">${DAB[d]}<b>${st?pct(st.ok,st.n)+'%':sessionDate(i).getDate()}</b></button>`}).join('')}</div>`;
}
function totals(){ let ok=0,n=0; Object.values(S.stats).forEach(s=>{ok+=s.ok;n+=s.n}); return {ok,n,done:Object.keys(S.days).length,err:Object.keys(S.err).length}; }
function vAvui(){
  const t=todayIdx(), np=nextPending(); let html='';
  if(t.idx!=null){
    html+=sessionCard(t.idx,'Avui');
    if(S.days[t.idx] && np!=null && np!==t.idx) html+=sessionCard(np,'Pendent');
  } else if(t.before){ html+=`<p class="muted">El pla comença el ${esc(fmtD(parseISO(S.start)))}. Pots avançar la primera sessió:</p>`+sessionCard(0,'Primera sessió'); }
  else if(t.after){ html+=`<section class="card"><h2>Has arribat al final del pla</h2><p class="muted">Fes servir Practica i el repàs d'errors per mantenir-te en forma fins a l'examen.</p></section>`; }
  else { html+=`<p class="muted">Avui és cap de setmana. Si vols, recupera una sessió pendent o repassa els errors.</p>`; if(np!=null) html+=sessionCard(np,'Pendent'); }
  const ref = t.idx!=null?Math.floor(t.idx/5)+1 : (np!=null?Math.floor(np/5)+1:16);
  const T=totals();
  html+=`<section style="display:grid;gap:10px"><span class="eyebrow">Setmana ${ref}</span>${weekStrip(ref)}</section>
  <section class="stats">
    <div class="stat"><span class="eyebrow">Sessions</span><b>${T.done} / ${TOTAL}</b><div class="meter"><i style="width:${pct(T.done,TOTAL)}%"></i></div></div>
    <div class="stat"><span class="eyebrow">Encerts</span><b>${T.n?pct(T.ok,T.n)+'%':'–'}</b><span class="muted">${T.n} exercicis fets</span></div>
    <div class="stat"><span class="eyebrow">Errors per repassar</span><b>${T.err}</b><span class="muted">tornen els divendres</span></div>
  </section>`;
  return html;
}
function vCal(){
  const t=todayIdx(); let h=`<section style="display:grid;gap:6px"><h2>Pla de 16 setmanes</h2><p class="muted">Cada dia laborable, 20 minuts. Verbs i pronoms cada dia, i la dificultat puja en espiral: les setmanes 9 a 15 tornen als mateixos temes amb exercicis més difícils. Divendres repassa els teus errors.</p></section><div class="cal">`;
  for(let w=1;w<=16;w++){
    const wi=weekInfo(w); const d0=sessionDate((w-1)*5), d4=sessionDate((w-1)*5+4);
    h+=`<div class="wk ${wi.consol?'consol':''}"><header><span class="num">S${String(w).padStart(2,'0')}</span><h3>${esc(wi.title)}</h3><span class="muted" style="font-size:.85rem">${d0.getDate()}/${d0.getMonth()+1} – ${d4.getDate()}/${d4.getMonth()+1}</span></header><div class="cells">`;
    for(let d=0;d<5;d++){ const i=(w-1)*5+d, st=S.days[i], ex=wi.consol&&d===4;
      h+=`<button class="cell ${st?'done':''} ${t.idx===i?'now':''} ${ex?'exam':''}" data-start="${i}">${DAB[d]} ${sessionDate(i).getDate()}<small>${st?pct(st.ok,st.n)+'%':(ex?'simulacre':'·')}</small></button>`; }
    h+=`</div></div>`;
  }
  return h+'</div>';
}
function vPrac(){
  const ne=Object.keys(S.err).length;
  let h=`<section style="display:grid;gap:6px"><h2>Practica lliure</h2><p class="muted">Tria un tema i fes 10 exercicis, fora del calendari.</p></section>`;
  if(ne) h+=`<div><button class="btn primary" data-review="1">Repassa els teus errors (${ne})</button></div>`;
  h+='<div class="mods">';
  for(const [k,m] of Object.entries(MODS)){
    let chips=`<button class="chip" data-prac="${k}|">Tot</button>`+Object.entries(m.topics).map(([t,n])=>`<button class="chip" data-prac="${k}|${t}">${esc(n)}</button>`).join('');
    if(k==='verb') chips+=Object.entries(TENSES).map(([t,o])=>`<button class="chip" data-prac="verb|${t}">${esc(o.n)}</button>`).join('');
    h+=`<section class="card" style="display:grid;gap:10px;align-content:start"><h3>${m.n}</h3><div class="chips">${chips}</div></section>`;
  }
  return h+'</div>';
}
function vTeo(){
  return `<section style="display:grid;gap:10px"><h2>Teoria</h2><div class="chips">${Object.entries(MODS).map(([k,m])=>`<button class="chip ${k===THEO?'on':''}" data-theo="${k}">${m.n}</button>`).join('')}</div></section><section class="card theory">${THEORY[THEO]}</section>`;
}
function vProg(){
  const T=totals();
  const bars=Object.entries(MODS).map(([k,m])=>{const s=S.stats[k]||{ok:0,n:0}; return `<div class="modbar"><span>${m.n}</span><div class="meter"><i style="width:${pct(s.ok,s.n)}%"></i></div><span>${s.n?pct(s.ok,s.n)+'%':'–'}</span></div>`}).join('');
  const errs=Object.entries(S.err).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([id,c])=>{const it=itemById(id); if(!it) return ''; const a=it.kind==='mc'?it.opts[it.correct]:it.ans[0]; const q=(it.q+' '+(it.sub||'')).replace(/<[^>]+>/g,''); return `<li><b>${esc(a)}</b> <span class="muted">— ${esc(q.slice(0,90))} (${c}×)</span></li>`}).join('');
  return `<section style="display:grid;gap:6px"><h2>El teu progrés</h2><p class="muted">${T.done} de ${TOTAL} sessions fetes · ${T.n} exercicis · ${T.n?pct(T.ok,T.n):0}% d'encerts</p></section>
  <section class="card" style="display:grid;gap:10px"><h3>Encerts per mòdul</h3>${bars}</section>
  <section class="card" style="display:grid;gap:10px"><h3>Errors que més es repeteixen</h3>${errs?`<ul class="errlist">${errs}</ul>`:'<p class="muted">Encara no n\'hi ha. Quan t\'equivoquis, els errors es guardaran aquí i tornaran a sortir els divendres.</p>'}</section>
  <section class="card" style="display:grid;gap:12px"><h3>Configuració</h3>
    <label class="row" for="startdate">Dilluns d'inici del pla <input type="date" id="startdate" value="${S.start}"></label>
    <div id="resetzone"><button class="btn" id="reset">Esborra tot el progrés</button></div>
  </section>`;
}
function bindView(){
  const m=$('#main');
  m.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startDay(+b.dataset.start));
  m.querySelectorAll('[data-review]').forEach(b=>b.onclick=startReview);
  m.querySelectorAll('[data-prac]').forEach(b=>b.onclick=()=>{const [mod,t]=b.dataset.prac.split('|'); startPrac(mod,t||null);});
  m.querySelectorAll('[data-theo]').forEach(b=>b.onclick=()=>{THEO=b.dataset.theo; render();});
  const sd=$('#startdate'); if(sd) sd.onchange=()=>{ if(!sd.value) return; S.start=iso(mondayOf(parseISO(sd.value))); save(); render(); };
  const rs=$('#reset'); if(rs) rs.onclick=()=>{ $('#resetzone').innerHTML=`<div class="confirm"><span>Segur? S'esborraran totes les sessions i errors.</span><button class="btn" id="rsno">Cancel·la</button><button class="btn primary" id="rsyes">Sí, esborra-ho</button></div>`; $('#rsno').onclick=render; $('#rsyes').onclick=()=>{ const st=S.start; S=freshState(); S.start=st; save(); render(); }; };
}

// ---- sessions ----
function startDay(idx){
  const pl=sessionPlan(idx); const att=(S.days[idx]&&S.days[idx].att)||0;
  const r=mulberry32(hashStr('s'+idx+':'+att));
  const items=[]; pl.blocks.forEach(([c,n],bi)=>buildBlock(c,n,pl.wi,r,S).forEach(it=>items.push({it,block:blockLabel(c,pl.wi),bi,nb:pl.blocks.length})));
  begin({kind:'day',idx,att,title:`Setmana ${pl.w} · ${DAYN[pl.d]}`,items});
}
function startPrac(mod,topic){
  const r=mulberry32(Date.now()&0xffffffff);
  const name=topic?(MODS[mod].topics[topic]||TENSES[topic].n):'Tot';
  begin({kind:'prac',title:`${MODS[mod].n} · ${name}`,items:practiceBlock(mod,topic,r,S).map(it=>({it,block:name,bi:0,nb:1}))});
}
function startReview(){
  const ids=Object.keys(S.err).sort((a,b)=>S.err[b]-S.err[a]).slice(0,15);
  const r=mulberry32(Date.now()&0xffffffff);
  begin({kind:'review',title:'Repàs d\'errors',items:shuffle(ids.map(itemById).filter(Boolean),r).map(it=>({it,block:'Repàs d\'errors',bi:0,nb:1}))});
}
function begin(run){
  const r=mulberry32(hashStr(run.title+run.items.length));
  run.items.forEach(x=>{ if(x.it.kind==='mc'){ const o=x.it.opts.map((t,i)=>({t,i})); const keep=o.some(z=>/\(res\)|dues|les dues/.test(z.t)); x.order=keep?o:shuffle(o,r);} });
  RUN=Object.assign(run,{i:0,res:[],answered:null,done:false}); render(); window.scrollTo(0,0);
}
const KEYS=['à','è','é','í','ï','ò','ó','ú','ü','ç','l·l','\''];
function renderQ(){
  const x=RUN.items[RUN.i], it=x.it, n=RUN.items.length, a=RUN.answered;
  let body;
  if(it.kind==='mc'){
    body=`<div class="opts">${x.order.map((o,k)=>{ let cls=''; if(a){ if(o.i===it.correct) cls='ok'; else if(o.i===a.val) cls='ko'; } return `<button class="opt ${cls}" data-opt="${o.i}" ${a?'disabled':''}><span class="muted" style="font-family:var(--f-mono);font-size:.8rem">${k+1}</span>&nbsp; ${esc(o.t)}</button>`}).join('')}</div>`;
  } else {
    body=`<div class="answer"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escriu la resposta" class="${a?(a.ok?'ok':'ko'):''}" ${a?'readonly':''} value="${a?esc(a.val):''}"><button class="btn primary" id="go">${a?'Següent':'Comprova'}</button></div>
    ${a?'':`<div class="keys">${KEYS.map(k=>`<button class="key" data-k="${esc(k)}" tabindex="-1">${esc(k)}</button>`).join('')}</div>`}`;
  }
  let fb='';
  if(a){
    const right=it.kind==='mc'?it.opts[it.correct]:it.ans[0];
    fb=`<div class="fb ${a.ok?'ok':'ko'}" role="status"><span class="verdict">${a.ok?'Correcte':(a.close?'Gairebé: revisa els accents':'No és correcte')}</span>${a.ok&&it.kind!=='mc'&&it.ans.length>1?`<span>També: ${esc(it.ans.slice(1,3).join(' · '))}</span>`:''}${!a.ok?`<span>Resposta: <b>${esc(right)}</b></span>`:''}<div>${it.exp||''}</div></div>
    ${it.kind==='mc'?`<div><button class="btn primary" id="go">Següent</button></div>`:''}`;
  }
  const blockInfo = x.nb>1?`Bloc ${x.bi+1} de ${x.nb} · ${esc(x.block)}`:esc(x.block);
  return `<section class="sess-top"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(RUN.title)}</span><button class="btn" id="quit" style="min-height:36px;padding:6px 12px">Surt</button></div>
    <div class="row" style="justify-content:space-between"><span>${blockInfo}</span><span class="eyebrow">${RUN.i+1} / ${n}</span></div>
    <div class="meter"><i style="width:${pct(RUN.i+(a?1:0),n)}%"></i></div></section>
  <section class="card qcard"><div class="qtext">${it.q}</div>${it.sub?`<div class="qsub">${it.sub}</div>`:''}${body}${fb}</section>
  <p class="muted" style="font-size:.85rem">Prem Retorn per comprovar i per passar a la següent.</p>`;
}
function answer(val){
  const x=RUN.items[RUN.i], it=x.it; if(RUN.answered) return;
  if(it.kind==='input' && !String(val).trim()) return;
  const c=check(it,val); RUN.answered={val,ok:c.ok,close:c.close}; RUN.res.push({id:it.id,ok:c.ok,mod:it.mod});
  const s=S.stats[it.mod]||(S.stats[it.mod]={ok:0,n:0}); s.n++; if(c.ok) s.ok++;
  if(STATIC[it.id]) S.seen[it.id]=(S.seen[it.id]||0)+1;
  if(!c.ok) S.err[it.id]=(S.err[it.id]||0)+1; else if(S.err[it.id]){ S.err[it.id]--; if(S.err[it.id]<=0) delete S.err[it.id]; }
  save(); render();
  const g=$('#go'); if(g) g.focus();
}
function next(){
  RUN.i++; RUN.answered=null;
  if(RUN.i>=RUN.items.length){ RUN.done=true;
    if(RUN.kind==='day'){ const ok=RUN.res.filter(r=>r.ok).length; S.days[RUN.idx]={ok,n:RUN.res.length,at:iso(new Date()),att:RUN.att+1}; save(); }
  }
  render(); window.scrollTo(0,0);
}
function renderResult(){
  const ok=RUN.res.filter(r=>r.ok).length, n=RUN.res.length;
  const wrong=RUN.res.filter(r=>!r.ok).map(r=>itemById(r.id)).filter(Boolean);
  const list=wrong.slice(0,12).map(it=>`<li><b>${esc(it.kind==='mc'?it.opts[it.correct]:it.ans[0])}</b> <span class="muted">— ${esc((it.q+' '+(it.sub||'')).replace(/<[^>]+>/g,'').slice(0,80))}</span></li>`).join('');
  const np=nextPending();
  return `<section class="card result"><span class="eyebrow">${esc(RUN.title)} · acabada</span><div class="bigscore">${ok}<span class="muted" style="font-size:1.4rem"> / ${n}</span></div>
  <p>${pct(ok,n)>=85?'Molt bé! Aquest nivell és el que cal per al C1.':pct(ok,n)>=65?'Bona feina. Els errors tornaran a sortir divendres.':'Hi ha feina per fer: revisa la teoria d\'aquests temes i torna-hi.'}</p>
  ${list?`<h3>Per repassar</h3><ul class="errlist">${list}</ul>`:''}
  <div class="row"><button class="btn primary" id="home">Torna a l'inici</button>${RUN.kind==='day'&&np!=null&&np!==RUN.idx?`<button class="btn" data-start="${np}">Sessió següent</button>`:''}</div></section>`;
}
function bindRun(){
  const m=$('#main');
  const q=$('#quit'); if(q) q.onclick=()=>{ RUN=null; render(); };
  const h=$('#home'); if(h) h.onclick=()=>setView('avui');
  m.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startDay(+b.dataset.start));
  m.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(+b.dataset.opt));
  const inp=$('#ans'), go=$('#go');
  if(go) go.onclick=()=>{ if(RUN.answered) next(); else if(inp) answer(inp.value); };
  if(inp && !RUN.answered){ inp.focus(); inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); answer(inp.value);} }; }
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ if(!inp) return; const k=b.dataset.k, s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s; inp.value=inp.value.slice(0,s)+k+inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+k.length,s+k.length); });
}
document.addEventListener('keydown',e=>{
  if(!RUN||RUN.done) return;
  if(RUN.answered && e.key==='Enter' && document.activeElement?.id!=='go'){ e.preventDefault(); next(); return; }
  const it=RUN.items[RUN.i].it;
  if(!RUN.answered && it.kind==='mc' && /^[1-4]$/.test(e.key)){ const o=RUN.items[RUN.i].order[+e.key-1]; if(o) answer(o.i); }
});
render();
initCloud();
</script>
</body></html>
